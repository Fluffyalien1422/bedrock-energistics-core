name: Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "npm"
      - name: Install Dependencies
        run: |
          npm ci
          cd scripts
          npm ci
      # Each check is its own step so the GitHub UI attributes a failure to the
      # tool that reported it. `!cancelled()` keeps the later steps running
      # after an earlier one fails, so a single run reports every problem
      # instead of stopping at the first.
      - name: Prettier
        run: npm run check-prettier
      - name: TypeScript
        if: ${{ !cancelled() }}
        run: npm run check-tsc
      - name: ESLint
        if: ${{ !cancelled() }}
        run: npm run check-eslint
      - name: TypeDoc
        if: ${{ !cancelled() }}
        run: npm run check-typedoc
